services:
  - type: web
    name: scamguard-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: 4000

  - type: web
    name: scamguard-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://scamguard-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
